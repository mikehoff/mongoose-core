[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongoose-core"
version = "1.53.361"
description = "Mongoose core: RTM management, unified search, document generation and the WordPress portal bridge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "cryptography>=42.0",
  "psutil>=5.9",
  # Decrypts the portal's sealed leaseholder access requests (rtm_portal).
  "pynacl>=1.5",
  # Receipts, demands and combined PDFs are money and evidence paths: not optional.
  "reportlab>=4",
  "pypdf>=4",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "pyflakes>=3.0", "pdfplumber>=0.11"]
content = ["pypdfium2>=4.0", "python-docx>=1.0"]          # PDF and Word text for search
rtm_docs = ["docxtpl>=0.16", "jinja2>=3.0", "pdfplumber>=0.11"]  # branded Word letters; PDF needs LibreOffice
embeddings = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"mongoose" = ["assets/rtm_templates/docx/*.docx", "assets/rtm_templates/email/*.txt",
              "assets/rtm_templates/*.png", "assets/rtm/*.json", "assets/profile.default.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
